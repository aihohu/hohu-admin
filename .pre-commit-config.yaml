repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: Ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true

      - id: ai-tools-static-check
        name: AI tools static compliance check
        entry: uv run python scripts/check_ai_tools.py
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: Pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        env:
          ENV: test
