[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hohu-admin"
version = "0.1.4"
description = "A front-end and back-end separated permission management system based on FastAPI, JWT, Vue 3, and Naive UI."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "HoHux", email = "jack@hohux.com"},
]
keywords = ["fastapi", "openapi", "mcp", "llm", "claude", "ai", "tools", "api", "dashboard", "admin-system"]
dependencies = [
    "alembic>=1.17.2",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.127.1",
    "httpx>=0.28.1",
    "openai>=2.14.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-jose[cryptography]>=3.5.0",
    "redis>=7.1.0",
    "ruff>=0.14.10",
    "snowflake-id>=1.0.2",
    "sqlalchemy[asyncio]>=2.0.45",
    "apscheduler>=3.10,<4.0",
    "pydantic-ai>=1.89.1",
    "openpyxl>=3.1.5",
    "prometheus-client>=0.25.0",
]


[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    "alembic",
    ".git",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # unused arguments in functions
    "T201", # print statements are not allowed
    "ASYNC", # flake8-async
    "PLC0415", # import should be at the top-level of a file
    "TID",     # flake8-tidy-imports（spec §3.9 banned-api）
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# spec §3.9 v2.2 P1-4：业务层禁止 import 具体存储实现，强制走 get_file_storage() 工厂
"app.core.file_storage.LocalFileStorage".msg = "业务层用 get_file_storage() 工厂注入；测试用 reset_file_storage_for_test(MockFileStorage())"
"app.core.file_storage.MockFileStorage".msg = "测试专用，业务层禁止 import；测试目录豁免 TID251"
"app.core.file_storage.S3FileStorage".msg = "Phase 3+ 才落地，业务层用 get_file_storage()"

[tool.ruff.lint.per-file-ignores]
# Scripts are CLI tools that use print() for user-facing output (init_db.py precedent)
"scripts/*" = ["T201"]
# 测试可 import 具体存储实现（MockFileStorage 等）
# file_storage 模块自身实现可引用具体类；Protocol 实现要求签名一致，未用参数是契约
"tests/*" = ["TID251"]
"app/core/file_storage.py" = ["TID251", "ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
addopts = "-v -s --strict-markers -p no:unraisableexception"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true

# 启用 "0.x" 版本行为：即使有 feat 提交，也不自动触发主版本（MAJOR）升级。
# 在项目处于初始开发阶段（v0.y.z）时，通常不希望 feat 导致 v1.0.0 发布，
# 因此设置 major_version_zero = true 可让 feat 仅提升 MINOR 版本（如 0.2.0 → 0.3.0）。
# 符合语义化版本规范（SemVer）对 0.x 阶段的建议：API 尚不稳定，不承诺兼容性。
major_version_zero = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "fakeredis>=2.36.0",
]
