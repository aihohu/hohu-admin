name: V016 secret boundary acceptance

on:
  pull_request:
    branches: ['release/0.1.6']

permissions:
  contents: read

jobs:
  check-secret-scope:
    name: Verify release secrets are unavailable to ordinary PRs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check availability flags without reading secret values
        env:
          ACR_USER_PRESENT: ${{ secrets.ACR_USERNAME != '' }}
          ACR_PASSWORD_PRESENT: ${{ secrets.ACR_PASSWORD != '' }}
        run: |
          set -euo pipefail
          test "$ACR_USER_PRESENT" = false
          test "$ACR_PASSWORD_PRESENT" = false
          echo 'Release secret availability flags are both false.'
