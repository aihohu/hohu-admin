name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.11"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with Ruff
        run: uv run ruff check . --output-format=github

      - name: Check Formatting
        run: uv run ruff format --check .

  pytest:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pyproject.toml declares requires-python = ">=3.12"
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pancake
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: hohu_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pancake -d hohu_admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: test
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.11"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Load test environment
        # alembic env.py + app config read via load_dotenv(); .env.test has the
        # service coordinates (pancake/mypassword@localhost:5432/hohu_admin) and
        # no real secrets, so we copy it to .env for the CI run.
        run: cp .env.test .env

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Seed test data
        run: |
          printf '\n' | uv run python scripts/init_db.py
          uv run python scripts/seed_ai_agents.py

      - name: Run Tests
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  qualification:
    name: Hosted release qualification (CI profile)
    needs: [ruff, pytest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: qualification
          POSTGRES_PASSWORD: qualification
          POSTGRES_DB: hohu_release_qualification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qualification -d hohu_release_qualification"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: test
      TENANT_MODE: single
      TENANT_HOSTED_LOGIN_ENABLED: "false"
      DATABASE_URL: postgresql+asyncpg://qualification:qualification@localhost:5432/hohu_release_qualification
      SECRET_KEY: plan7c-ci-qualification-secret-key-only
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 9
      HOHU_RELEASE_QUALIFICATION_EPHEMERAL: "true"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.11"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run automated hosted release qualification
        run: |
          mkdir -p "${RUNNER_TEMP}/tenant-release-qualification"
          uv run python scripts/qualify_tenant_hosted_release.py \
            --build-sha "$(git rev-parse HEAD)" \
            --profile ci \
            --output "${RUNNER_TEMP}/tenant-release-qualification/qualification.json"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-release-qualification-ci-${{ github.sha }}
          path: ${{ runner.temp }}/tenant-release-qualification/
          if-no-files-found: error
          retention-days: 14
