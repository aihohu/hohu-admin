name: CI

on:
  workflow_call:
    inputs:
      source_sha:
        description: Pinned application commit selected by the trusted release controller
        type: string
        required: false
        default: ''
  push:
    branches: [main, master, 'release/*']
  pull_request:
    branches: [main, master, 'release/*']

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.11"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Lint with Ruff
        run: uv run ruff check . --output-format=github

      - name: Check Formatting
        run: uv run ruff format --check .

      - name: Check AI tools
        env:
          ENV: test
        run: uv run python -m tools.checks.check_ai_tools

      - name: Check public documentation
        run: uv run python -m tools.checks.check_docs

  pytest:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml declares requires-python = ">=3.12"
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pancake
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: hohu_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pancake -d hohu_admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: test
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.11"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Load test environment
        # alembic env.py + app config read via load_dotenv(); .env.test has the
        # service coordinates (pancake/mypassword@localhost:5432/hohu_admin) and
        # no real secrets, so we copy it to .env for the CI run.
        run: cp .env.test .env

      - name: Initialize the selected source in the ephemeral test database
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          if [[ -f tests/release/bootstrap_database.py ]]; then
            RELEASE_BUILD_SHA="$(git rev-parse HEAD)" \
            HOHU_TEST_DATABASE_EPHEMERAL=true \
            AUTHORIZATION_MAINTENANCE_PASSWORD=CiSeed123456 \
            uv run python -m tests.release.bootstrap_database \
              --build-sha "$(git rev-parse HEAD)" \
              --control-dir "${RUNNER_TEMP}/pytest-bootstrap"
          else
            HOHU_ADMIN_PASSWORD=CiSeed123456 uv run python -m scripts.init_db
          fi

      - name: Check transfer HTTP contracts before the full gate
        run: |
          set -euo pipefail
          COVERAGE_FILE="${RUNNER_TEMP}/transfer-contract.coverage" \
          uv run coverage run --source=app -m pytest \
            tests/core/test_opaque_field_identity.py \
            tests/modules/system/test_generic_transfer_http.py \
            --basetemp "${RUNNER_TEMP}/transfer-contract" \
            -o "cache_dir=${RUNNER_TEMP}/transfer-contract-cache"

      - name: Run Tests
        run: |
          set -euo pipefail
          if [[ -f tools/ci/sharding.py ]]; then
            uv run python -m tools.ci.sharding run --output "${RUNNER_TEMP}/serial"
            COVERAGE_FILE="${RUNNER_TEMP}/serial/coverage.data" \
              uv run coverage report --rcfile "${RUNNER_TEMP}/serial/coverage.toml" --fail-under=70
          else
            uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=70 --durations=30 \
              --basetemp "${RUNNER_TEMP}/pytest-full" -o "cache_dir=${RUNNER_TEMP}/pytest-cache"
          fi

      - name: Save serial test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-${{ matrix.python-version }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/serial/report.json
            ${{ runner.temp }}/serial/junit.xml
            ${{ runner.temp }}/serial/coverage.data
            ${{ runner.temp }}/serial/coverage.toml
            ${{ runner.temp }}/serial/pytest.log
          if-no-files-found: warn
          retention-days: 14

  qualification:
    name: Hosted release qualification (CI profile)
    needs: [ruff, pytest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: qualification
          POSTGRES_PASSWORD: qualification
          POSTGRES_DB: hohu_release_qualification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qualification -d hohu_release_qualification"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: test
      TENANT_MODE: single
      TENANT_HOSTED_LOGIN_ENABLED: "false"
      DATABASE_URL: postgresql+asyncpg://qualification:qualification@localhost:5432/hohu_release_qualification
      SECRET_KEY: plan7c-ci-qualification-secret-key-only
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 9
      HOHU_RELEASE_QUALIFICATION_EPHEMERAL: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.11"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run automated hosted release qualification
        run: |
          mkdir -p "${RUNNER_TEMP}/tenant-release-qualification"
          uv run python -m tests.release.qualify_tenant_hosted_release \
            --build-sha "$(git rev-parse HEAD)" \
            --profile ci \
            --output "${RUNNER_TEMP}/tenant-release-qualification/qualification.json"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-release-qualification-ci-${{ github.sha }}
          path: ${{ runner.temp }}/tenant-release-qualification/
          if-no-files-found: error
          retention-days: 14
