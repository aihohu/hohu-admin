name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-publish-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  qualification:
    name: Hosted release qualification (release profile)
    if: github.repository == 'aihohu/hohu-admin' && github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: qualification
          POSTGRES_PASSWORD: qualification
          POSTGRES_DB: hohu_release_qualification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qualification -d hohu_release_qualification"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: test
      TENANT_MODE: single
      TENANT_HOSTED_LOGIN_ENABLED: "false"
      DATABASE_URL: postgresql+asyncpg://qualification:qualification@localhost:5432/hohu_release_qualification
      SECRET_KEY: plan7c-release-qualification-secret-key-only
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 9
      HOHU_RELEASE_QUALIFICATION_EPHEMERAL: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.11"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run complete hosted release qualification
        run: |
          mkdir -p "${RUNNER_TEMP}/tenant-release-qualification"
          uv run python -m tests.release.qualify_tenant_hosted_release \
            --build-sha "$(git rev-parse HEAD)" \
            --profile release \
            --output "${RUNNER_TEMP}/tenant-release-qualification/qualification.json"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-release-qualification-release-${{ github.sha }}
          path: ${{ runner.temp }}/tenant-release-qualification/
          if-no-files-found: error
          retention-days: 90

  docker:
    name: Build and Push Docker Image
    needs: qualification
    # A skipped release qualification must not skip the manual test build.
    if: >-
      ${{ always() && !cancelled() && github.repository == 'aihohu/hohu-admin' &&
          ((github.event_name == 'release' && needs.qualification.result == 'success') ||
           (github.event_name == 'workflow_dispatch' &&
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: docker
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags || steps.test_tag.outputs.tags }}
      commit: ${{ steps.source.outputs.sha }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Record source commit
        id: source
        shell: bash
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify standalone image mirror tooling
        run: python3 -B -m unittest discover -s tests/tools -p test_sync_image_mirror.py -v

      - name: Validate manual ACR test configuration
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          ACR_MIRROR_ENABLED: ${{ vars.ACR_MIRROR_ENABLED }}
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$ACR_MIRROR_ENABLED" != 'true' || -z "$ACR_USERNAME" || -z "$ACR_PASSWORD" ]]; then
            echo '::error::Configure ACR_USERNAME, ACR_PASSWORD and set ACR_MIRROR_ENABLED=true before running a manual mirror test.'
            exit 1
          fi
          python3 tools/ops/sync_image_mirror.py validate \
            --source "$REGISTRY/$IMAGE_NAME" --registry "$ACR_REGISTRY" --repository "$ACR_REPOSITORY"

      - name: Generate isolated test image tag
        id: test_tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          tag="$(python3 tools/ops/sync_image_mirror.py test-tag --sha "$SOURCE_SHA" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT")"
          printf 'tags=%s/%s:%s\n' "$REGISTRY" "$IMAGE_NAME" "$tag" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        if: github.event_name == 'release'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=true

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags || steps.test_tag.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  acr:
    name: Sync and anonymously verify ACR image
    needs: docker
    # Manual builds skip qualification; only the direct build must succeed.
    if: >-
      ${{ !cancelled() && needs.docker.result == 'success' &&
          github.repository == 'aihohu/hohu-admin' && vars.ACR_MIRROR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: docker
    permissions:
      contents: read
      packages: read
    env:
      SOURCE_IMAGE: ghcr.io/${{ github.repository }}
      IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
      IMAGE_TAGS: ${{ needs.docker.outputs.tags }}
      ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
      ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
      REGISTRY_AUTH_FILE: ${{ github.workspace }}/.local/private/acr-mirror/auth.json
      MIRROR_WORK_DIR: ${{ github.workspace }}/.local/tmp/acr-mirror
      MIRROR_REPORT: ${{ github.workspace }}/.local/reports/acr-mirror.json
    steps:
      - name: Check out the built source's mirror tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.docker.outputs.commit }}
          persist-credentials: false

      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo

      - name: Validate and authenticate registries
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ github.token }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          python3 tools/ops/sync_image_mirror.py validate \
            --source "$SOURCE_IMAGE" --registry "$ACR_REGISTRY" --repository "$ACR_REPOSITORY"
          if [[ -z "$ACR_USERNAME" || -z "$ACR_PASSWORD" ]]; then
            echo '::error::Configure ACR_USERNAME and ACR_PASSWORD.'
            exit 1
          fi
          umask 077
          mkdir -p "$(dirname "$REGISTRY_AUTH_FILE")"
          printf '%s' "$GHCR_PASSWORD" | skopeo login --tls-verify=true --authfile "$REGISTRY_AUTH_FILE" --username "$GHCR_USERNAME" --password-stdin ghcr.io
          printf '%s' "$ACR_PASSWORD" | skopeo login --tls-verify=true --authfile "$REGISTRY_AUTH_FILE" --username "$ACR_USERNAME" --password-stdin "$ACR_REGISTRY"

      - name: Copy pinned image and verify anonymous downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MIRROR_WORK_DIR"
          printf '%s\n' "$IMAGE_TAGS" > "$MIRROR_WORK_DIR/tags.txt"
          python3 tools/ops/sync_image_mirror.py sync \
            --source "$SOURCE_IMAGE" --registry "$ACR_REGISTRY" --repository "$ACR_REPOSITORY" \
            --digest "$IMAGE_DIGEST" --tags-file "$MIRROR_WORK_DIR/tags.txt" \
            --work-dir "$MIRROR_WORK_DIR" --report "$MIRROR_REPORT"
          printf '### ACR image mirror\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$MIRROR_REPORT" >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mirror verification report
        uses: actions/upload-artifact@v4
        with:
          name: acr-mirror-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/reports/acr-mirror.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary registry credentials
        if: always()
        shell: bash
        run: rm -f -- "$REGISTRY_AUTH_FILE"
