name: Release

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  qualification:
    name: Hosted release qualification (release profile)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: qualification
          POSTGRES_PASSWORD: qualification
          POSTGRES_DB: hohu_release_qualification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qualification -d hohu_release_qualification"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: test
      TENANT_MODE: single
      TENANT_HOSTED_LOGIN_ENABLED: "false"
      DATABASE_URL: postgresql+asyncpg://qualification:qualification@localhost:5432/hohu_release_qualification
      SECRET_KEY: plan7c-release-qualification-secret-key-only
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 9
      HOHU_RELEASE_QUALIFICATION_EPHEMERAL: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.11"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run complete hosted release qualification
        run: |
          mkdir -p "${RUNNER_TEMP}/tenant-release-qualification"
          uv run python scripts/qualify_tenant_hosted_release.py \
            --build-sha "$(git rev-parse HEAD)" \
            --profile release \
            --output "${RUNNER_TEMP}/tenant-release-qualification/qualification.json"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-release-qualification-release-${{ github.sha }}
          path: ${{ runner.temp }}/tenant-release-qualification/
          if-no-files-found: error
          retention-days: 90

  docker:
    name: Build and Push Docker Image
    needs: qualification
    runs-on: ubuntu-latest
    environment: docker
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=true

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
