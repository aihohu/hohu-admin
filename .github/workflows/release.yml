name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '发布模式：test 测试镜像 / release 正式发布'
        type: choice
        required: true
        default: test
        options:
          - test
          - release
      version:
        description: '正式发布版本（例如 v0.1.5）；测试镜像请留空'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: image-publish-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  RELEASE_TAG: ${{ inputs.version }}
  ACR_MIRROR_ENABLED: ${{ vars.ACR_MIRROR_ENABLED }}
  ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
  ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
  RELEASE_EXCLUSIVE_WRITER_CONFIRMED: ${{ vars.RELEASE_EXCLUSIVE_WRITER_CONFIRMED }}

jobs:
  prepare:
    name: Validate web release request
    if: github.repository == 'aihohu/hohu-admin' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.request.outputs.mode }}
      tag: ${{ steps.request.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Require the default branch
        env:
          SELECTED_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$SELECTED_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo '::error::Run this workflow from the default branch.'
            exit 1
          fi

      - name: Validate versions and reviewed release notes
        id: request
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          python3 -B tools/ops/prepare_release.py --mode "$RELEASE_MODE" --tag "$RELEASE_TAG" \
            --notes-file .local/artifacts/release-notes.md --github-output "$GITHUB_OUTPUT"

      - name: Reject an existing version from another run
        if: steps.request.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.request.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 -B -m tools.ops.release_tag check

      - name: Run standalone release tooling tests
        run: |
          mkdir -p .local/tmp
          TMPDIR="$PWD/.local/tmp" python3 -B -m unittest discover -s tests/tools -p 'test_*release*.py' -v

  ci:
    name: Verify release source
    needs: prepare
    if: needs.prepare.outputs.mode == 'release'
    uses: ./.github/workflows/ci.yml

  qualification:
    name: Hosted release qualification (release profile)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: qualification
          POSTGRES_PASSWORD: qualification
          POSTGRES_DB: hohu_release_qualification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qualification -d hohu_release_qualification"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: test
      TENANT_MODE: single
      TENANT_HOSTED_LOGIN_ENABLED: "false"
      DATABASE_URL: postgresql+asyncpg://qualification:qualification@localhost:5432/hohu_release_qualification
      SECRET_KEY: plan7c-release-qualification-secret-key-only
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 9
      HOHU_RELEASE_QUALIFICATION_EPHEMERAL: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.11"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run complete hosted release qualification
        run: |
          mkdir -p "${RUNNER_TEMP}/tenant-release-qualification"
          uv run python -m tests.release.qualify_tenant_hosted_release \
            --build-sha "$(git rev-parse HEAD)" \
            --profile release \
            --output "${RUNNER_TEMP}/tenant-release-qualification/qualification.json"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-release-qualification-release-${{ github.sha }}
          path: ${{ runner.temp }}/tenant-release-qualification/
          if-no-files-found: error
          retention-days: 90

  tag:
    name: Create release tag after qualification
    needs: qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: docker
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Create or verify the tag owned by this run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 -B -m tools.ops.release_tag create

  docker:
    name: Build and Push Docker Image
    needs: [prepare, qualification, tag]
    # A skipped release qualification must not skip the manual test build.
    if: >-
      ${{ always() && !cancelled() && github.repository == 'aihohu/hohu-admin' &&
          github.event_name == 'workflow_dispatch' && needs.prepare.result == 'success' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          (needs.prepare.outputs.mode == 'test' ||
           (needs.prepare.outputs.mode == 'release' &&
            needs.qualification.result == 'success' && needs.tag.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: docker
    env:
      REGISTRY_AUTH_FILE: ${{ github.workspace }}/.local/private/release-auth.json
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags || steps.test_tag.outputs.tags }}
      commit: ${{ steps.source.outputs.sha }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Refuse formal build reruns before any build preparation
        env:
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
        run: python3 -B -m tools.ops.release_build guard --mode "$RELEASE_MODE"

      - name: Record source commit
        id: source
        shell: bash
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify standalone image mirror tooling
        run: python3 -B -m unittest discover -s tests/tools -p test_sync_image_mirror.py -v

      - name: Validate manual ACR test configuration
        if: needs.prepare.outputs.mode == 'test'
        shell: bash
        env:
          ACR_MIRROR_ENABLED: ${{ vars.ACR_MIRROR_ENABLED }}
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$ACR_MIRROR_ENABLED" != 'true' || -z "$ACR_USERNAME" || -z "$ACR_PASSWORD" ]]; then
            echo '::error::Configure ACR_USERNAME, ACR_PASSWORD and set ACR_MIRROR_ENABLED=true before running a manual mirror test.'
            exit 1
          fi
          python3 -B -m tools.ops.sync_image_mirror validate \
            --source "$REGISTRY/$IMAGE_NAME" --registry "$ACR_REGISTRY" --repository "$ACR_REPOSITORY"

      - name: Generate isolated test image tag
        id: test_tag
        if: needs.prepare.outputs.mode == 'test'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          tag="$(python3 -B -m tools.ops.sync_image_mirror test-tag --sha "$SOURCE_SHA" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT")"
          printf 'tags=%s/%s:%s\n' "$REGISTRY" "$IMAGE_NAME" "$tag" >> "$GITHUB_OUTPUT"

      - name: Install release registry tooling
        if: needs.prepare.outputs.mode == 'release'
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo

      - name: Prove complete versions absent before the first formal build
        if: needs.prepare.outputs.mode == 'release'
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ github.token }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          RELEASE_EXCLUSIVE_WRITER_CONFIRMED: ${{ vars.RELEASE_EXCLUSIVE_WRITER_CONFIRMED }}
        run: python3 -B -m tools.ops.release_build preflight

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        if: needs.prepare.outputs.mode == 'release'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
          flavor: |
            latest=false

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # ACR rejects OCI attestation artifacts with empty config descriptors.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags || steps.test_tag.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Freeze the original build digest and platform evidence
        if: needs.prepare.outputs.mode == 'release'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$(dirname "$REGISTRY_AUTH_FILE")"
          printf '%s' "$GHCR_PASSWORD" | skopeo login --tls-verify=true --authfile "$REGISTRY_AUTH_FILE" --username "$GHCR_USERNAME" --password-stdin ghcr.io
          python3 -B -m tools.ops.release_build record

      - name: Save the unique original build record
        if: needs.prepare.outputs.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: component-build-${{ github.run_id }}-1
          path: .local/artifacts/component-build.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
          retention-days: 90

      - name: Remove build verification credentials
        if: always()
        run: rm -f -- "$REGISTRY_AUTH_FILE"

  acr:
    name: Sync and anonymously verify ACR image
    needs: docker
    # Manual builds skip qualification; only the direct build must succeed.
    if: >-
      ${{ !cancelled() && needs.docker.result == 'success' &&
          github.repository == 'aihohu/hohu-admin' && vars.ACR_MIRROR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: docker
    permissions:
      contents: read
      actions: read
      packages: read
    env:
      SOURCE_IMAGE: ghcr.io/${{ github.repository }}
      IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
      IMAGE_TAGS: ${{ needs.docker.outputs.tags }}
      ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
      ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
      REGISTRY_AUTH_FILE: ${{ github.workspace }}/.local/private/acr-mirror/auth.json
      MIRROR_WORK_DIR: ${{ github.workspace }}/.local/tmp/acr-mirror
      MIRROR_REPORT: ${{ github.workspace }}/.local/reports/acr-mirror.json
    steps:
      - name: Check out the built source's mirror tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.docker.outputs.commit }}
          persist-credentials: false

      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo

      - name: Validate and authenticate registries
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ github.token }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          python3 -B -m tools.ops.sync_image_mirror validate \
            --source "$SOURCE_IMAGE" --registry "$ACR_REGISTRY" --repository "$ACR_REPOSITORY"
          if [[ -z "$ACR_USERNAME" || -z "$ACR_PASSWORD" ]]; then
            echo '::error::Configure ACR_USERNAME and ACR_PASSWORD.'
            exit 1
          fi
          umask 077
          mkdir -p "$(dirname "$REGISTRY_AUTH_FILE")"
          printf '%s' "$GHCR_PASSWORD" | skopeo login --tls-verify=true --authfile "$REGISTRY_AUTH_FILE" --username "$GHCR_USERNAME" --password-stdin ghcr.io
          printf '%s' "$ACR_PASSWORD" | skopeo login --tls-verify=true --authfile "$REGISTRY_AUTH_FILE" --username "$ACR_USERNAME" --password-stdin "$ACR_REGISTRY"

      - name: Restore only the first successful build from this run
        if: inputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B -m tools.ops.release_build restore

      - name: Copy pinned image and verify anonymous downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MIRROR_WORK_DIR"
          printf '%s\n' "$IMAGE_TAGS" > "$MIRROR_WORK_DIR/tags.txt"
          python3 -B -m tools.ops.sync_image_mirror sync \
            --source "$SOURCE_IMAGE" --registry "$ACR_REGISTRY" --repository "$ACR_REPOSITORY" \
            --digest "$IMAGE_DIGEST" --tags-file "$MIRROR_WORK_DIR/tags.txt" \
            --work-dir "$MIRROR_WORK_DIR" --report "$MIRROR_REPORT"
          printf '### ACR image mirror\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$MIRROR_REPORT" >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mirror verification report
        uses: actions/upload-artifact@v4
        with:
          name: acr-mirror-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/reports/acr-mirror.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary registry credentials
        if: always()
        shell: bash
        run: rm -f -- "$REGISTRY_AUTH_FILE"

  github-release:
    name: Publish GitHub Release after image delivery
    needs: [prepare, docker, acr]
    if: >-
      ${{ !cancelled() && github.repository == 'aihohu/hohu-admin' &&
          github.event_name == 'workflow_dispatch' && needs.prepare.outputs.mode == 'release' &&
          needs.docker.result == 'success' &&
          (needs.acr.result == 'success' ||
           (needs.acr.result == 'skipped' && vars.ACR_MIRROR_ENABLED != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: docker
    env:
      REGISTRY_AUTH_FILE: ${{ github.workspace }}/.local/private/release-auth.json
    permissions:
      contents: write
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.docker.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install delivery verification tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo

      - name: Authenticate delivery readers
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ github.token }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$(dirname "$REGISTRY_AUTH_FILE")"
          printf '%s' "$GHCR_PASSWORD" | skopeo login --tls-verify=true --authfile "$REGISTRY_AUTH_FILE" --username "$GHCR_USERNAME" --password-stdin ghcr.io
          if [[ "$ACR_MIRROR_ENABLED" == 'true' ]]; then
            test -n "$ACR_USERNAME" && test -n "$ACR_PASSWORD"
            printf '%s' "$ACR_PASSWORD" | skopeo login --tls-verify=true --authfile "$REGISTRY_AUTH_FILE" --username "$ACR_USERNAME" --password-stdin "$ACR_REGISTRY"
          fi

      - name: Extract release notes from the built source
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 -B tools/ops/prepare_release.py --tag "$RELEASE_TAG" --notes-file .local/artifacts/release-notes.md

      - name: Publish release without overwriting an existing announcement
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B -m tools.ops.release_build publish

      - name: Remove delivery verification credentials
        if: always()
        run: rm -f -- "$REGISTRY_AUTH_FILE"
