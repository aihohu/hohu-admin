name: Verify stable release channel

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to verify without publishing
        type: string
        required: true
        default: v0.1.6
      source_sha:
        description: Full application source SHA
        type: string
        required: true
        default: 71966784b4eb35d0fde9d8c62657137fdc562879
      peer_sha:
        description: Full same-version counterpart SHA
        type: string
        required: true
        default: 72d2a46d84704517ac7257e3a695fe9f66253f1c

permissions:
  contents: read

concurrency:
  group: stable-verification-${{ github.repository }}
  cancel-in-progress: false

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  RELEASE_MODE: release
  RELEASE_CHANNEL: stable-0.1
  RELEASE_TAG: ${{ inputs.version }}
  RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
  RELEASE_PEER_SHA: ${{ inputs.peer_sha }}

jobs:
  prepare:
    name: Verify the fixed stable source pair
    if: github.repository == 'aihohu/hohu-admin' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.selection.outputs.source_sha }}
      provenance: ${{ steps.selection.outputs.provenance }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify selection without authorizing a formal build
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B -m tools.ops.stable_release --verify-only --github-output "$GITHUB_OUTPUT"

  ci:
    name: Verify stable application source
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}

  qualification:
    name: Hosted release qualification (release profile)
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: qualification
          POSTGRES_PASSWORD: qualification
          POSTGRES_DB: hohu_release_qualification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qualification -d hohu_release_qualification"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: test
      TENANT_MODE: single
      TENANT_HOSTED_LOGIN_ENABLED: "false"
      DATABASE_URL: postgresql+asyncpg://qualification:qualification@localhost:5432/hohu_release_qualification
      SECRET_KEY: plan7c-release-qualification-secret-key-only
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 9
      HOHU_RELEASE_QUALIFICATION_EPHEMERAL: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.11"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run complete hosted release qualification
        run: |
          mkdir -p "${RUNNER_TEMP}/tenant-release-qualification"
          uv run python -m tests.release.qualify_tenant_hosted_release \
            --build-sha "$(git rev-parse HEAD)" \
            --profile release \
            --output "${RUNNER_TEMP}/tenant-release-qualification/qualification.json"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-verification-qualification-${{ needs.prepare.outputs.source_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/tenant-release-qualification/
          if-no-files-found: error
          retention-days: 90

  candidate:
    name: Build unpublished stable candidate
    needs: [prepare, ci, qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: .local/release-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare candidate output directory
        run: mkdir -p .local/artifacts
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the selected source without registry writes
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .local/release-source
          file: .local/release-source/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
          outputs: type=oci,dest=.local/artifacts/stable-candidate.tar
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}
            org.opencontainers.image.version=${{ inputs.version }}
      - name: Record unpublished candidate identity
        env:
          APPLICATION_SHA: ${{ needs.prepare.outputs.source_sha }}
          SOURCE_PROVENANCE: ${{ needs.prepare.outputs.provenance }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root = Path('.local/artifacts')
          with (root / 'stable-candidate.tar').open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', os.environ['BUILD_DIGEST'])
          evidence = {
              'schema': 'hohu-unpublished-stable-candidate-v1',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'controller_sha': os.environ['GITHUB_SHA'],
              'source_sha': os.environ['APPLICATION_SHA'],
              'source_provenance': json.loads(os.environ['SOURCE_PROVENANCE']),
              'version': os.environ['RELEASE_TAG'],
              'build_digest': os.environ['BUILD_DIGEST'],
              'archive_sha256': digest,
              'run_id': os.environ['GITHUB_RUN_ID'],
              'published': False,
          }
          (root / 'candidate-evidence.json').write_text(json.dumps(evidence, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Retain the unpublished candidate and its identity
        uses: actions/upload-artifact@v4
        with:
          name: stable-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/artifacts/stable-candidate.tar
            .local/artifacts/candidate-evidence.json
          include-hidden-files: true
          overwrite: false
          if-no-files-found: error
          retention-days: 14
