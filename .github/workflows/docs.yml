name: Documentation

on:
  push:
    branches: [main, master, 'release/*']
  pull_request:
    branches: [main, master, 'release/*']

permissions:
  contents: read

concurrency:
  group: docs-${{ github.repository }}-${{ github.event_name == 'pull_request' && !(startsWith(github.event.pull_request.head.ref, 'release/') && contains(fromJSON('["main","master"]'), github.event.pull_request.base.ref)) && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !(startsWith(github.event.pull_request.head.ref, 'release/') && contains(fromJSON('["main","master"]'), github.event.pull_request.base.ref)) }}

jobs:
  public-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check documentation publication and links
        run: python -m tools.checks.check_docs
      - name: Verify documentation guardrails
        run: python -m unittest discover -s tests/tools -p test_check_docs.py
