services:
  admin:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: hohu_admin
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENV=prod
      - UVICORN_WORKERS=4
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
